<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="app_title">WebScreen Console</title>
    <link rel="manifest" href="/static/manifest.json">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/console.css">
    <script src="/static/ui.js" defer></script>
    <script type="module" src="/static/console.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[#141414] text-[#e3e3e3] pb-20 md:pb-0">

    <!-- Top App Bar -->
    <header
        class="sticky top-0 z-10 backdrop-blur-md bg-[#141414]/90 border-b border-[#28292a] px-4 py-3.5 md:px-8 md:py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <span class="material-symbols-rounded text-3xl text-[var(--md-sys-color-primary)] shrink-0">devices</span>
                <h1 class="text-lg md:text-2xl font-semibold tracking-tight truncate" data-i18n="app_title">
                    WebScreen Console
                </h1>

                <!-- Language Switcher -->
                <div class="flex items-center gap-1.5 ml-2 md:ml-6 border-l border-gray-700 pl-3 md:pl-6 shrink-0">
                    <button type="button"
                        class="lang-btn px-1.5 py-0.5 rounded text-xs font-medium text-gray-400 hover:text-white transition-colors"
                        data-lang="en">EN</button>
                    <button type="button"
                        class="lang-btn px-1.5 py-0.5 rounded text-xs font-medium text-gray-400 hover:text-white transition-colors"
                        data-lang="zh">中文</button>
                    <button type="button"
                        class="lang-btn px-1.5 py-0.5 rounded text-xs font-medium text-gray-400 hover:text-white transition-colors"
                        data-lang="ja">JP</button>
                </div>
            </div>

            <!-- Global Toolbar -->
            <div class="flex items-center gap-1 shrink-0">
                <button type="button" id="globalSettingsBtn"
                    class="flex items-center gap-1.5 px-3 py-2 rounded-full hover:bg-white/10 transition-colors text-sm font-medium text-[#e3e3e3]"
                    data-i18n-title="global_settings" title="Global Settings">
                    <span class="material-symbols-rounded text-xl text-[var(--md-sys-color-primary)]">tune</span>
                    <span class="hidden sm:inline" data-i18n="global_settings">全局设置</span>
                </button>
                <button type="button" id="clearStorageBtn"
                    class="p-2 rounded-full hover:bg-white/10 transition-colors"
                    data-i18n-title="clear_local_storage" title="Clear local storage">
                    <span class="material-symbols-rounded text-[#e3e3e3]" aria-hidden="true">delete_sweep</span>
                    <span class="sr-only" data-i18n="clear_local_storage">清空本地存储</span>
                </button>
                <button type="button" id="refreshDevicesBtn"
                    class="p-2 rounded-full hover:bg-white/10 transition-colors"
                    data-i18n-title="refresh" title="Refresh">
                    <span class="material-symbols-rounded text-[#e3e3e3]">refresh</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8">

        <!-- Section Header & Action Triggers -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-medium mb-1" data-i18n="connected_devices">已连接设备</h2>
                <p class="text-sm text-[var(--md-sys-color-on-surface-variant)]" data-i18n="manage_devices_subtitle">
                    管理和串流您的设备
                </p>
            </div>

            <div class="flex flex-wrap gap-2.5 w-full md:w-auto">
                <button type="button" id="toggleIgnoredBtn"
                    class="hidden flex-none items-center justify-center gap-1.5 px-4 py-2.5 rounded-full border border-gray-700 text-gray-400 hover:text-white hover:bg-[#333] transition-colors font-medium text-sm"
                    data-i18n-title="toggle_ignored_devices" title="Show/Hide ignored devices">
                    <span class="material-symbols-rounded text-lg" id="toggleIgnoredIcon">visibility_off</span>
                    <span id="ignoredCountBadge" class="text-xs font-mono">0</span>
                </button>

                <button type="button" id="openAndroidPairBtn"
                    class="flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-[#2a2b2c] text-[#e3e3e3] hover:bg-[#333] transition-colors font-medium text-sm">
                    <span class="material-symbols-rounded text-lg">qr_code_scanner</span>
                    <span data-i18n="wireless_pair">无线配对</span>
                </button>

                <button type="button" id="openGameStreamPairBtn"
                    class="flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-[#2a2b2c] text-[#e3e3e3] hover:bg-[#333] transition-colors font-medium text-sm">
                    <span class="material-symbols-rounded text-lg">sports_esports</span>
                    <span data-i18n="gamestream_pair">GameStream 配对</span>
                </button>

                <button type="button" id="openConnectDeviceBtn"
                    class="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-2.5 rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] hover:opacity-90 transition-opacity font-medium text-sm shadow-md">
                    <span class="material-symbols-rounded text-lg">add</span>
                    <span data-i18n="connect_device">连接设备</span>
                </button>
            </div>
        </div>

        <!-- Device Grid -->
        <div id="deviceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                <div class="spinner mb-4"></div>
                <p data-i18n="scanning_devices">正在扫描设备...</p>
            </div>
        </div>

    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>
</body>

</html>
