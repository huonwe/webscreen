hostname: localhost
ip_listen: 0.0.0.0
port_listen: 8081
# Secret key for JWT authentication
jwt_secret: change_before_use
# Allowed IP addresses for PIN authentication
trusted_ips:
- 127.0.0.1
- ::1
- 192.168.0.0/24
# Must be 6 digits
pin: "000000"
mtu: 1400

udp_range_start: 51200
udp_range_end: 51210
ice_servers:
- stun:stun.l.google.com:19302