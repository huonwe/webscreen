services:
  webscreen:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
    image: dukihiroi/webscreen:latest
    container_name: webscreen
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      
      - ./data:/webscreen/data