services:
  scrmux:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
    image: dukihiroi/scrmux:latest
    container_name: scrmux
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      
      - ./data:/scrmux/data