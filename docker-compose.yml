services:
  scrmux:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
    image: dukihiroi/scrmux:latest
    container_name: scrmux
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - DATA_DIR=./data
      - TLS=false
      - DOMAIN="localhost"
      - IP="127.0.0.1"
      - PORT=8081