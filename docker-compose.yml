services:
  webscreen:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
    user: appuser
    image: dukihiroi/webscreen:latest
    container_name: webscreen
    network_mode: host

    restart: unless-stopped
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro

      - ./config.yml:/app/webscreen/config.yml
    devices:
      - /dev/uinput:/dev/uinput
      - /dev/dri:/dev/dri
    group_add:
      - ${UINPUT_GID}
    privileged: true
    environment:
      - GIN_MODE=release
      - PORT=8081
      - PIN=DISABLED